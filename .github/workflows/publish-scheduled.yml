# Free scheduler: pings the app every 5 minutes so due scheduled posts get published.
# Add repo secrets: APP_BASE_URL (e.g. https://your-app.vercel.app) and CRON_SECRET (same value as in Vercel).
name: Publish scheduled posts
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/publish-scheduled"
